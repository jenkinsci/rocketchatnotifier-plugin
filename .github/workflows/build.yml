name: CI

on: [push]

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        java: [17, 21]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Run Tests
        run: ./mvnw --no-transfer-progress clean verify

  security-scan:
    uses: jenkins-infra/jenkins-security-scan/.github/workflows/jenkins-security-scan.yaml@v2
    with:
      java-cache: 'maven'
      java-version: 17

  deploy:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: maven

      - name: publish release package
        if: contains( github.ref, 'main' ) || contains( github.base_ref, 'main' )
        env:
          JENKINS_MAVEN_PASS: ${{ secrets.JENKINS_MAVEN_PASS }}
        run: ./mvnw -s .github/workflows/m2.settings.xml deploy -DskipTests=true
